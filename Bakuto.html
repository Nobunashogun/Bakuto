<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BAKUTO</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #080604;
      color: #ddd0b5;
      font-family: 'Space Mono', monospace;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #root { width: 100%; height: 100%; }

    /* Scanline grain */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,0,0,0.045) 3px, rgba(0,0,0,0.045) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    @keyframes diceRoll {
      0%   { transform: rotateX(0deg)   rotateY(0deg)   rotateZ(0deg); }
      18%  { transform: rotateX(210deg) rotateY(140deg) rotateZ(55deg); }
      40%  { transform: rotateX(390deg) rotateY(255deg) rotateZ(28deg); }
      62%  { transform: rotateX(545deg) rotateY(330deg) rotateZ(72deg); }
      82%  { transform: rotateX(678deg) rotateY(395deg) rotateZ(18deg); }
      100% { transform: rotateX(720deg) rotateY(360deg) rotateZ(0deg); }
    }

    @keyframes popIn {
      0%   { transform: scale(0.4); opacity: 0; }
      60%  { transform: scale(1.12); }
      100% { transform: scale(1);   opacity: 1; }
    }

    button { -webkit-tap-highlight-color: transparent; }
    button:active { opacity: 0.75; }

    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: #080604; }
    ::-webkit-scrollbar-thumb { background: #2a1e16; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Load shared components first, then screens -->
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel">
const { useState, useRef } = React;

// ── Persistent game state ──────────────────────────────────────────────────────

const SAVE_KEY = 'bakuto_state_v1';

const DEFAULT_STATE = {
  money: 10000,
  level: 0,           // completed fights; 0 = haven't fought yet
  inventory: [],
  diceConfig: [4, 4, 4, 3, 3, 3],
};

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (raw && typeof raw.money === 'number') return { ...DEFAULT_STATE, ...raw };
  } catch (e) {}
  return { ...DEFAULT_STATE };
}

// ── App ────────────────────────────────────────────────────────────────────────

function App() {
  const [screen, setScreen] = useState('title');
  const [state, setState] = useState(loadState);

  // Persist + update state in one call
  function save(patch) {
    setState(prev => {
      const next = { ...prev, ...patch };
      localStorage.setItem(SAVE_KEY, JSON.stringify(next));
      return next;
    });
  }

  function reset() {
    localStorage.removeItem(SAVE_KEY);
    setState({ ...DEFAULT_STATE });
    setScreen('title');
  }

  // ── Navigation ──────────────────────────────────────────────────────────────

  function enterDungeon() {
    const nextLevel = state.level + 1;
    // Back Room appears before every 7th, 14th, 21st... fight
    if (nextLevel % 7 === 0) {
      setScreen('backroom');
    } else {
      setScreen('battle');
    }
  }

  function handleBattleExit(result, finalMoney) {
    const nextLevel = result === 'win' ? state.level + 1 : state.level;
    save({ money: finalMoney !== undefined ? finalMoney : state.money, level: nextLevel });
    setScreen('title');
  }

  function handleDeath() {
    reset();
  }

  function handleBackRoomLeave(money, inventory) {
    save({ money, inventory });
    setScreen('battle');
  }

  // ── Screens ─────────────────────────────────────────────────────────────────

  if (screen === 'title') {
    return (
      <window.TitleScreen
        money={state.money}
        level={state.level}
        inventory={state.inventory}
        onEnterDungeon={enterDungeon}
        onDice={() => setScreen('dice')}
        onReset={reset}
      />
    );
  }

  if (screen === 'dice') {
    return (
      <window.DiceScreen
        diceConfig={state.diceConfig}
        onSave={faces => { save({ diceConfig: faces }); setScreen('title'); }}
        onBack={() => setScreen('title')}
      />
    );
  }

  if (screen === 'backroom') {
    return (
      <window.BackRoomScreen
        money={state.money}
        level={state.level}
        inventory={state.inventory}
        onLeave={handleBackRoomLeave}
        onReset={reset}
      />
    );
  }

  if (screen === 'battle') {
    return (
      <window.BattleScreen
        money={state.money}
        setMoney={() => {}}
        level={state.level + 1}
        diceConfig={state.diceConfig}
        inventory={state.inventory}
        onExit={handleBattleExit}
        onDeath={handleDeath}
        onReset={reset}
      />
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
