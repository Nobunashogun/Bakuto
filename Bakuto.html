<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BAKUTO</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #080604;
      color: #ddd0b5;
      font-family: 'Space Mono', monospace;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #root { width: 100%; height: 100%; }

    /* Scanline grain */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,0,0,0.045) 3px, rgba(0,0,0,0.045) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    @keyframes diceRoll {
      0%   { transform: rotateX(0deg)   rotateY(0deg)   rotateZ(0deg); }
      18%  { transform: rotateX(210deg) rotateY(140deg) rotateZ(55deg); }
      40%  { transform: rotateX(390deg) rotateY(255deg) rotateZ(28deg); }
      62%  { transform: rotateX(545deg) rotateY(330deg) rotateZ(72deg); }
      82%  { transform: rotateX(678deg) rotateY(395deg) rotateZ(18deg); }
      100% { transform: rotateX(720deg) rotateY(360deg) rotateZ(0deg); }
    }

    @keyframes popIn {
      0%   { transform: scale(0.4); opacity: 0; }
      60%  { transform: scale(1.12); }
      100% { transform: scale(1);   opacity: 1; }
    }

    button { -webkit-tap-highlight-color: transparent; }
    button:active { opacity: 0.75; }

    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: #080604; }
    ::-webkit-scrollbar-thumb { background: #2a1e16; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- ── COMPONENTS ────────────────────────────────────────────────────────────── -->
<script type="text/babel">
const { useState: _useStateC, useRef: _useRefC } = React;

// ── Cauldron SVG ─────────────────────────────────────────────────────────────

        <animate attributeName="opacity" values="0.1;0.25;0.1" dur="1.2s" repeatCount="indefinite"/>
      </ellipse>

        </path>
        <path stroke="#3a3030" opacity="0.4">

        </path>

      <circle cx="66" cy="31" r="0" fill="#c08820"><animate attributeName="r" values="0;5;0" dur="1.1s" repeatCount="indefinite" begin="0.35s"/><animate attributeName="cy" values="35;28;35" dur="1.1s" repeatCount="indefinite" begin="0.35s"/><animate attributeName="opacity" values="0;0.6;0" dur="1.1s" repeatCount="indefinite" begin="0.35s"/></circle>
      <circle cx="80" cy="34" r="0" fill="#c45a10"><animate attributeName="r" values="0;3;0" dur="0.7s" repeatCount="indefinite" begin="0.6s"/><animate attributeName="cy" values="36;31;36" dur="0.7s" repeatCount="indefinite" begin="0.6s"/><animate attributeName="opacity" values="0;0.7;0" dur="0.7s" repeatCount="indefinite" begin="0.6s"/></circle>
      <path d="M13,38 Q9,80 60,82 Q111,80 107,38" fill="#0e0a06" stroke="#5a2010" strokeWidth="2.5"/>

// ── Board SVG ─────────────────────────────────────────────────────────────────
const BoardSVG = ({ pathLen, playerPos, aiPos, boardCheats, onTileClick, placingCheat, placingType }) => {
  const TW = 28, TH = 28, GAP = 3;
  const n = pathLen - 1;
  const PAD = 10;
  const rowW = n * (TW + GAP) - GAP;
  const AI_Y = 8;
  const PLR_Y = 72;
  const END_X = PAD + rowW + 32;
  const END_Y = 28;
  const END_SIZE = 40;
  const SVG_W = END_X + END_SIZE + 8;
  const SVG_H = PLR_Y + TH + 10;

  function tx(i) { return PAD + i * (TW + GAP); }

  const lastAiX = tx(n - 1) + TW;
  const lastPlrX = tx(n - 1) + TW;
  const lastAiY = AI_Y + TH / 2;
  const lastPlrY = PLR_Y + TH / 2;
  const endCX = END_X + END_SIZE / 2;
  const endCY = END_Y + END_SIZE / 2;
  const crossX = lastAiX + (END_X - lastAiX) * 0.45;
  const aiMidY = endCY + 16;
  const plrMidY = endCY - 16;
  const goodCheatColor = '#c08820';
  const badCheatColor = '#c42b24';

  function renderTile(i, y, pathKey, isToken, hasCheat, cheatGood, clickable) {
    const x = tx(i);
    const isStart = i === 0;
    let fill = '#110d08', stroke = '#2a1e16', sw = 1;
    if (isToken) { fill = pathKey === 'player' ? '#201800' : '#180800'; stroke = pathKey === 'player' ? '#c08820' : '#c42b24'; sw = 2; }
    if (hasCheat) { fill = cheatGood ? '#190f00' : '#160400'; stroke = cheatGood ? '#c08820' : '#c42b24'; sw = 1.5; }
    if (isStart) { fill = '#0c100a'; stroke = '#2a3020'; }
    if (clickable) { stroke = '#c08820'; sw = 2; }
    return (
      <g key={`${pathKey}-${i}`} onClick={() => clickable && onTileClick(i, pathKey)} style={{ cursor: clickable ? 'pointer' : 'default' }}>
        <rect x={x} y={y} width={TW} height={TH} fill={fill} stroke={stroke} strokeWidth={sw}/>
        {clickable && <rect x={x - 3} y={y - 3} width={TW + 6} height={TH + 6} fill="none" stroke="#c08820" strokeWidth="1" strokeDasharray="3 2" opacity="0.7"/>}
        {isStart && <text x={x + TW / 2} y={y + TH / 2 + 4} textAnchor="middle" fontFamily="Bebas Neue,sans-serif" fontSize="9" fill="#2a3020">S</text>}
        {hasCheat && !isStart && (
          <text x={x + TW / 2} y={y + TH / 2 + 4} textAnchor="middle" fontFamily="Bebas Neue,sans-serif" fontSize="8" fill={cheatGood ? goodCheatColor : badCheatColor}>
            {(window.CHEATS_DATA && window.CHEATS_DATA[hasCheat]) ? window.CHEATS_DATA[hasCheat].name.slice(0, 2) : '??'}
          </text>
        )}
        {isToken && (
          <circle cx={x + TW / 2} cy={y + TH / 2} r={9} fill={pathKey === 'player' ? '#c08820' : '#c42b24'} opacity="0.85">
            <animate attributeName="opacity" values="0.85;0.5;0.85" dur="1.4s" repeatCount="indefinite"/>
            <animate attributeName="r" values="9;10;9" dur="1.4s" repeatCount="indefinite"/>
          </circle>
        )}
        {isToken && (
          <text x={x + TW / 2} y={y + TH / 2 + 4} textAnchor="middle" fontFamily="Bebas Neue,sans-serif" fontSize="10" fill="#0d0908">
            {pathKey === 'player' ? 'U' : 'E'}
          </text>
        )}
      </g>
    );
  }

  return (
    <div style={{ overflowX: 'auto', overflowY: 'hidden' }}>
      <svg viewBox={`0 0 ${SVG_W} ${SVG_H}`} style={{ display: 'block', minWidth: SVG_W, height: SVG_H }}>
        <text x="2" y={AI_Y - 2} fontFamily="Press Start 2P,monospace" fontSize="5" fill="#504540" letterSpacing="1">AI</text>
        <text x="2" y={PLR_Y - 2} fontFamily="Press Start 2P,monospace" fontSize="5" fill="#504540" letterSpacing="1">YOU</text>
        <path d={`M${lastAiX},${lastAiY} Q${crossX},${aiMidY} ${endCX},${endCY}`} fill="none" stroke="#c42b24" strokeWidth="1.5" opacity="0.5" strokeDasharray="5 3"/>
        <path d={`M${lastPlrX},${lastPlrY} Q${crossX},${plrMidY} ${endCX},${endCY}`} fill="none" stroke="#c08820" strokeWidth="1.5" opacity="0.5" strokeDasharray="5 3"/>
        <circle cx={crossX} cy={(aiMidY + plrMidY) / 2} r="3" fill="none" stroke="#c42b24" strokeWidth="1" opacity="0.4"/>
        {Array.from({ length: n }).map((_, i) => {
          const bc = boardCheats.find(c => c.path === 'ai' && c.pos === i);
          const clickable = placingCheat && i !== 0 && placingType === 'bad';
          return renderTile(i, AI_Y, 'ai', aiPos === i, bc ? bc.cheatId : null, false, clickable);
        })}
        {Array.from({ length: n }).map((_, i) => {
          const bc = boardCheats.find(c => c.path === 'player' && c.pos === i);
          const clickable = placingCheat && i !== 0 && placingType === 'good';
          return renderTile(i, PLR_Y, 'player', playerPos === i, bc ? bc.cheatId : null, true, clickable);
        })}
        <rect x={END_X} y={END_Y} width={END_SIZE} height={END_SIZE} fill="#1a0808" stroke="#c42b24" strokeWidth="2.5"/>
        <rect x={END_X - 3} y={END_Y - 3} width={END_SIZE + 6} height={END_SIZE + 6} fill="none" stroke="#c42b24" strokeWidth="1" opacity="0.3">
          <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.5s" repeatCount="indefinite"/>
        </rect>
        <line x1={endCX} y1={END_Y + 4} x2={endCX} y2={END_Y + END_SIZE - 4} stroke="#c42b24" strokeWidth="1" opacity="0.4"/>
        <line x1={END_X + 4} y1={endCY} x2={END_X + END_SIZE - 4} y2={endCY} stroke="#c42b24" strokeWidth="1" opacity="0.4"/>
        <text x={endCX} y={endCY + 5} textAnchor="middle" fontFamily="Bebas Neue,sans-serif" fontSize="11" fill="#c42b24" letterSpacing="1">END</text>
        {playerPos === pathLen - 1 && (
          <circle cx={endCX + 8} cy={endCY} r="8" fill="#c08820" opacity="0.9">
            <animate attributeName="r" values="8;11;8" dur="0.6s" repeatCount="indefinite"/>
          </circle>
        )}
        {aiPos === pathLen - 1 && (
          <circle cx={endCX - 8} cy={endCY} r="8" fill="#c42b24" opacity="0.9">
            <animate attributeName="r" values="8;11;8" dur="0.6s" repeatCount="indefinite"/>
          </circle>
        )}
      </svg>
    </div>
  );
};

// ── Cheat Tile ─────────────────────────────────────────────────────────────────
const CheatTile = ({ cheat, selected, onBoard, onClick, active }) => {
  const isGood = cheat.type === 'good';
  const accent = isGood ? '#c08820' : '#c42b24';
  const dimFrame = isGood ? '#4a3010' : '#4a1010';
  const frameBright = active || selected ? accent : dimFrame;
  return (
    <div onClick={onClick} style={{
      width: 72, minWidth: 72, height: 72,
      background: active ? (isGood ? '#1e1500' : '#180400') : selected ? (isGood ? '#161200' : '#140200') : '#110d08',
      border: `2px solid ${frameBright}`,
      borderLeft: `5px solid ${frameBright}`,
      boxShadow: active ? `0 0 12px ${accent}55` : `inset 3px 0 0 ${dimFrame}22`,
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      gap: 3, cursor: onClick ? 'pointer' : 'default',
      opacity: onBoard ? 0.4 : 1,
      position: 'relative',
      transition: 'all 0.1s',
      userSelect: 'none',
    }}>
      <div style={{ position: 'absolute', top: 3, right: 3, width: 6, height: 6, background: cheat.tier === 'high' ? '#c42b24' : cheat.tier === 'medium' ? '#c08820' : '#4e8a4e' }}/>
      <div style={{ position: 'absolute', top: 3, left: 6, fontFamily: "'Press Start 2P', monospace", fontSize: 7, color: frameBright, lineHeight: 1 }}>
        {isGood ? '▲' : '▼'}
      </div>
      <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 11, letterSpacing: 0.5, color: active || selected ? accent : '#907868', textAlign: 'center', lineHeight: 1.1, maxWidth: 64, marginTop: 8 }}>
        {cheat.name}
      </div>
      {onBoard && <div style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 5, color: '#3a3028', letterSpacing: 0.5 }}>PLACED</div>}
      {active && <div style={{ position: 'absolute', bottom: 3, fontFamily: "'Press Start 2P', monospace", fontSize: 5, color: accent, letterSpacing: 0 }}>SELECT</div>}
    </div>
  );
};

// ── Dice Face Cell ─────────────────────────────────────────────────────────────
const DiceFaceCell = ({ value, faceIdx, isCenter, onChange, remaining }) => {
  const [editing, setEditing] = _useStateC(false);
  const [draft, setDraft] = _useStateC(String(value));
  const inputRef = _useRefC(null);

  function startEdit() { setEditing(true); setDraft(String(value)); }
  function commitEdit() {
    setEditing(false);
    const v = Math.max(0, parseInt(draft) || 0);
    onChange(v);
  }

  return (
    <div style={{
      width: 72, height: 72,
      background: isCenter ? '#1e1000' : '#130e08',
      border: `2px solid ${isCenter ? '#c08820' : '#3a2a1e'}`,
      boxShadow: isCenter ? '0 0 20px rgba(192,136,32,0.25), inset 0 0 10px rgba(192,136,32,0.05)' : 'none',
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      position: 'relative', userSelect: 'none',
    }}>
      <div style={{ position: 'absolute', top: 3, left: 4, fontFamily: "'Press Start 2P', monospace", fontSize: 5, color: '#3a2e1e', lineHeight: 1 }}>
        F{faceIdx + 1}
      </div>
      {editing ? (
        <input
          ref={inputRef}
          autoFocus
          value={draft}
          onChange={e => setDraft(e.target.value)}
          onBlur={commitEdit}
          onKeyDown={e => { if (e.key === 'Enter') commitEdit(); if (e.key === 'Escape') setEditing(false); }}
          style={{
            width: 40, background: 'transparent', border: 'none', borderBottom: '2px solid #c08820',
            fontFamily: "'Bebas Neue', sans-serif", fontSize: 28, color: '#c08820',
            textAlign: 'center', outline: 'none',
          }}
        />
      ) : (
        <div onClick={startEdit} style={{
          fontFamily: "'Bebas Neue', sans-serif", fontSize: 36, lineHeight: 1,
          color: isCenter ? '#c08820' : '#ddd0b5',
          cursor: 'pointer',
          textShadow: isCenter ? '0 0 12px rgba(192,136,32,0.5)' : 'none',
        }}>{value}</div>
      )}
      <div style={{ display: 'flex', gap: 6, marginTop: 3 }}>
        <button onClick={() => onChange(Math.max(0, value - 1))} style={{
          width: 20, height: 18, background: '#1e1810', border: '1px solid #3a2a1e',
          color: '#504540', fontFamily: "'Bebas Neue', sans-serif", fontSize: 14,
          cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0,
        }}>−</button>
        <button onClick={() => { if (remaining > 0) onChange(value + 1); }} style={{
          width: 20, height: 18, background: '#1e1810', border: `1px solid ${remaining > 0 ? '#3a2a1e' : '#1e1810'}`,
          color: remaining > 0 ? '#907868' : '#2a2018', fontFamily: "'Bebas Neue', sans-serif", fontSize: 14,
          cursor: remaining > 0 ? 'pointer' : 'not-allowed', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0,
        }}>+</button>
      </div>
    </div>
  );
};

// ── 3D Dice Cube ─────────────────────────────────────────────────────────────
const DiceCube3D = ({ faces = [0,0,0,0,0,0], rolling = false, resultFace = 0, size = 72, customTransform = null, borderColor = '#c08820', hidden = false }) => {
  const h = size / 2;
  const faceTransforms = [
    `translateZ(${h}px)`,
    `rotateY(180deg) translateZ(${h}px)`,
    `rotateY(90deg) translateZ(${h}px)`,
    `rotateY(-90deg) translateZ(${h}px)`,
    `rotateX(90deg) translateZ(${h}px)`,
    `rotateX(-90deg) translateZ(${h}px)`,
  ];
  const showFace = [
    `rotateX(-18deg) rotateY(0deg)`,
    `rotateX(-18deg) rotateY(180deg)`,
    `rotateX(-18deg) rotateY(-90deg)`,
    `rotateX(-18deg) rotateY(90deg)`,
    `rotateX(-108deg) rotateY(0deg)`,
    `rotateX(72deg) rotateY(0deg)`,
  ];
  const finalTransform = rolling ? undefined : (customTransform !== null ? customTransform : showFace[resultFace % 6]);
  return (
    <div style={{ perspective: 400, width: size, height: size }}>
      <div style={{
        width: size, height: size,
        position: 'relative', transformStyle: 'preserve-3d',
        transform: finalTransform,
        animation: rolling ? 'diceRoll 0.75s ease-out forwards' : 'none',
      }}>
        {faceTransforms.map((tf, i) => (
          <div key={i} style={{
            position: 'absolute', width: size, height: size,
            background: `linear-gradient(135deg, #1e1508 0%, #0f0b06 100%)`,
            border: `2px solid ${borderColor}`,
            boxShadow: 'inset 0 0 8px rgba(0,0,0,0.6)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            backfaceVisibility: 'hidden',
            transform: tf,
          }}>
            <span style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: size * 0.44, color: hidden ? '#2a1e10' : '#ddd0b5', lineHeight: 1, textShadow: '0 2px 4px rgba(0,0,0,0.8)' }}>
              {hidden ? '?' : (faces[i] !== undefined ? faces[i] : '?')}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
};

// ── Pixel Label ───────────────────────────────────────────────────────────────
const PxLabel = ({ children, color = '#504540', size = 7, style = {} }) => (
  <span style={{ fontFamily: "'Press Start 2P', monospace", fontSize: size, color, lineHeight: 1.6, letterSpacing: 0.5, ...style }}>
    {children}
  </span>
);

// ── Art Placeholder ──────────────────────────────────────────────────────────
const ArtPlaceholder = ({ label = 'ILLUSTRATION', style = {} }) => (
  <div style={{ position: 'relative', overflow: 'hidden', background: '#080604', ...style }}>
    <svg width="100%" height="100%" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" style={{ display: 'block', position: 'absolute', inset: 0 }}>
      <defs>
        <pattern id="hatch45" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(45)">
          <rect width="10" height="20" fill="#130c08"/>
          <rect x="10" width="10" height="20" fill="#0e0906"/>
        </pattern>
        <radialGradient id="artGlow" cx="50%" cy="60%" r="50%">
          <stop offset="0%" stopColor="#2a0a04" stopOpacity="0.8"/>
          <stop offset="100%" stopColor="#080604" stopOpacity="0"/>
        </radialGradient>
      </defs>
      <rect width="100%" height="100%" fill="url(#hatch45)"/>
      <rect width="100%" height="100%" fill="url(#artGlow)"/>
    </svg>

const BattleScreen = ({ money, setMoney, level, diceConfig, inventory, onExit, onDeath, onReset }) => {

  const [inspectRotY, setInspectRotY] = _useState(20);

  const addLog = useCallback((msg) => setLog(prev => [msg, ...prev].slice(0, 6)), []);

  function startFight() {
    if (currentMoney < blindAmt) { setPhase('bankrupt'); return; }
    const newPot = blindAmt * 2;

      if (result.landed === 'end') setTimeout(() => resolveEnd('player'), 400);

  function doAiTurn() {
    if (skipAi > 0) { setSkipAi(s => s - 1); addLog('ENEMY TURN SKIPPED'); setPhase('player_turn'); return; }

    setTimeout(() => {
      setAiRolling(false);

      const bc = boardCheats.find(c => c.path === 'ai' && c.pos === result.pos);
      if (bc) {
        setBoardCheats(p => p.filter(c => !(c.path === 'ai' && c.pos === result.pos)));

  function triggerCheat(id, landedBy) {

    if (boardCheats.find(bc => bc.pos === pos && bc.path === path)) { addLog('TILE OCCUPIED'); return; }
    setBoardCheats(prev => [...prev, { pos, cheatId: activePlacing, path }]);
    addLog(`PLACED ${c.name}`);
    setActivePlacing(null);
  }

  const placingType = activePlacing ? (CHEATS_DATA[activePlacing]?.type === 'good' ? 'good' : 'bad') : null;
  const isInBattle = ['player_turn', 'ai_turn'].includes(phase);
  const isPrep = phase === 'prep';

  if (phase === 'bankrupt') return (
    <div style={{ width: '100%', height: '100%', background: '#080604', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 12 }}>
      <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(ellipse at 50% 80%, rgba(150,10,5,0.3) 0%, transparent 60%)', pointerEvents: 'none' }}/>

      <div style={{ width: 80, height: 3, background: '#c42b24' }}/>

      <button onClick={onDeath} style={{ marginTop: 12, fontFamily: "'Bebas Neue', sans-serif", fontSize: 20, letterSpacing: 4, background: '#c42b24', color: '#e8d8b0', border: 'none', padding: '14px 32px', cursor: 'pointer', boxShadow: '0 0 24px rgba(196,43,36,0.5)' }}>BEGIN NEW RUN</button>
    </div>
  );

    <div style={{ width: '100%', height: '100%', display: 'flex', flexDirection: 'column', background: '#080604', overflow: 'hidden', position: 'relative' }}>

      {/* HEADER */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 14px', borderBottom: '1px solid #1e1610', flexShrink: 0, background: '#0a0806' }}>
        <div style={{ display: 'flex', gap: 14, alignItems: 'center' }}>
          <div><_PxLabel size={6} color="#2a2018">FLOOR</_PxLabel><div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 20, color: '#ddd0b5', lineHeight: 1 }}>{level}</div></div>
          <div style={{ width: 1, height: 28, background: '#1e1610' }}/>
          <div><_PxLabel size={6} color="#2a2018">FUNDS</_PxLabel><div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 20, color: '#c08820', lineHeight: 1 }}>¥{currentMoney.toLocaleString()}</div></div>
          <div style={{ width: 1, height: 28, background: '#1e1610' }}/>
          <div><_PxLabel size={6} color="#2a2018">BLIND</_PxLabel><div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 20, color: '#504540', lineHeight: 1 }}>¥{blindAmt}</div></div>
        </div>
        <div style={{ display: 'flex', gap: 6 }}>
          {isPrep && <button onClick={() => setShowPrepOverlay(true)} style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 6, letterSpacing: 1, background: '#1a1610', color: '#907868', border: '1px solid #2a1e16', padding: '5px 8px', cursor: 'pointer' }}>PREP</button>}
          {onReset && <button onClick={onReset} style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 6, letterSpacing: 1, background: 'transparent', color: '#4a2018', border: '1px solid #1e1410', padding: '5px 8px', cursor: 'pointer' }}>RESET</button>}
          <button onClick={() => setShowQuit(true)} style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 6, letterSpacing: 1, background: 'transparent', color: '#3a3028', border: '1px solid #1e1610', padding: '5px 8px', cursor: 'pointer' }}>QUIT</button>
        </div>

      <div style={{ flex: '0 0 50%', display: 'flex', flexDirection: 'column', borderBottom: '2px solid #2a1e16', position: 'relative', minHeight: 0, background: '#0a0706' }}>

          <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
            {phase === 'player_turn' && <_PxLabel size={6} color="#c08820">YOUR TURN</_PxLabel>}

          {activePlacing && (

            </div>
          )}
        </div>
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'space-around', padding: '6px 10px', minHeight: 0 }}>

          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 24 }}>

              <div><_PxLabel size={6} color="#2a2018">PATH LENGTH</_PxLabel><div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 18, color: '#504540', lineHeight: 1 }}>{pathLen} TILES</div></div>
              {skipPlayer > 0 && <div style={{ background: '#1a0808', border: '1px solid #c42b24', padding: '3px 6px' }}><_PxLabel size={6} color="#c42b24">SKIP ×{skipPlayer}</_PxLabel></div>}
            </div>

      {/* BOTTOM HALF */}

              const isOnBoard = !!boardCheats.find(bc => bc.cheatId === id);
              const isActive = activePlacing === id;
              return (
                <div key={id}>
                  <_CheatTile cheat={c} selected={isSelected} onBoard={isOnBoard} active={isActive} onClick={() => {
                    if (isPrep) toggleCheat(id);
                    else if (isInBattle && isSelected && !isOnBoard) handleCheatTileTap(id);
                  }}/>
                  {isPrep && !isOnBoard && (

                      <_PxLabel size={6} color={isSelected ? '#c08820' : '#2a2018'}>{isSelected ? '✓ IN' : '+ ADD'}</_PxLabel>
                    </div>

              <div key={i} style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 7, lineHeight: 2, color: i === 0 ? '#907868' : '#3a2e20', letterSpacing: 0 }}>{l}</div>

            <button onClick={startFight} style={{ flexShrink: 0, width: '100%', fontFamily: "'Bebas Neue', sans-serif", fontSize: 24, letterSpacing: 5, background: '#c42b24', color: '#e8d8b0', border: 'none', padding: '14px', cursor: 'pointer', boxShadow: '0 0 24px rgba(196,43,36,0.4)' }}>BEGIN FIGHT</button>

          {phase === 'player_turn' && (
            <div style={{ flexShrink: 0, display: 'flex', gap: 12, alignItems: 'center' }}>

                  <_DiceCube3D faces={localDice} rolling={diceRolling} resultFace={resultFaceIdx} size={60}/>
                  <div style={{ position: 'absolute', bottom: -2, right: -2, background: '#c08820', width: 16, height: 16, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <_PxLabel size={5} color="#0a0806">↻</_PxLabel>

                </div>
                {lastRoll !== null && !diceRolling && (
                  <div style={{ display: 'flex', gap: 4, alignItems: 'baseline' }}>

                  </div>

              </div>
              <button onClick={handleRoll} disabled={diceRolling} style={{ flex: 1, fontFamily: "'Bebas Neue', sans-serif", fontSize: 28, letterSpacing: 5, background: diceRolling ? '#1e1610' : '#c08820', color: diceRolling ? '#2a2018' : '#0a0806', border: 'none', padding: '16px 10px', cursor: diceRolling ? 'default' : 'pointer', boxShadow: diceRolling ? 'none' : '0 0 20px rgba(192,136,32,0.35)', transition: 'all 0.15s' }}>{diceRolling ? '...' : 'ROLL'}</button>
            </div>
          )}

          {phase === 'ai_turn' && (
            <div style={{ flexShrink: 0, padding: '10px 14px', border: '1px solid #2a1a14', background: '#0e0806', display: 'flex', gap: 16, alignItems: 'center' }}>
              <_DiceCube3D faces={[' ',' ',' ',' ',' ',' ']} rolling={aiRolling} resultFace={aiResultFace} size={60} borderColor="#c42b24" hidden={true}/>
              <div>
                <_PxLabel size={8} color="#c42b24">{aiRolling ? 'ENEMY ROLLING...' : 'ENEMY MOVED'}</_PxLabel>
                {!aiRolling && <div style={{ marginTop: 4 }}><_PxLabel size={6} color="#3a2018">DICE HIDDEN · INFO ASYMMETRY</_PxLabel></div>}
              </div>
            </div>
          )}

          {phase === 'end_round' && (
            <div style={{ flexShrink: 0 }}>
              <div style={{ padding: '10px 14px', marginBottom: 8, background: '#0e0806', border: `2px solid ${miniRoundWinner === 'player' ? '#c08820' : '#c42b24'}`, textAlign: 'center', boxShadow: miniRoundWinner === 'player' ? '0 0 20px rgba(192,136,32,0.2)' : '0 0 20px rgba(196,43,36,0.2)' }}>
                <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 30, letterSpacing: 5, color: miniRoundWinner === 'player' ? '#c08820' : '#c42b24', textShadow: miniRoundWinner === 'player' ? '0 0 20px rgba(192,136,32,0.5)' : '0 0 20px rgba(196,43,36,0.5)' }}>
                  {miniRoundWinner === 'player' ? 'YOU WIN THE ROUND' : 'ENEMY WINS'}
                </div>
                <_PxLabel size={7} color="#504540">{miniRoundWinner === 'player' ? `+¥${pot.toLocaleString()} CLAIMED` : `¥${pot.toLocaleString()} LOST`}</_PxLabel>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={quitDungeon} style={{ flex: 1, fontFamily: "'Bebas Neue', sans-serif", fontSize: 13, letterSpacing: 2, background: 'transparent', color: '#504540', border: '1px solid #2a1e16', padding: '10px', cursor: 'pointer' }}>QUIT · KEEP ¥{currentMoney.toLocaleString()}</button>
                <button onClick={continueRound} style={{ flex: 2, fontFamily: "'Bebas Neue', sans-serif", fontSize: 18, letterSpacing: 4, background: '#c42b24', color: '#e8d8b0', border: 'none', padding: '10px', cursor: 'pointer', boxShadow: '0 0 16px rgba(196,43,36,0.35)' }}>CONTINUE →</button>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* DICE INSPECT OVERLAY */}
      {showDiceInspect && (() => {
        function handleDrag(e) {
          e.preventDefault();
          const isTouch = e.touches !== undefined;
          const startX = isTouch ? e.touches[0].clientX : e.clientX;
          const startY = isTouch ? e.touches[0].clientY : e.clientY;
          const startRX = inspectRotX;
          const startRY = inspectRotY;
          function onMove(ev) {
            const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
            const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
            setInspectRotY(startRY + (cx - startX) * 0.9);
            setInspectRotX(startRX - (cy - startY) * 0.9);
          }
          function onUp() {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            window.removeEventListener('touchmove', onMove);
            window.removeEventListener('touchend', onUp);
          }
          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
          window.addEventListener('touchmove', onMove, { passive: false });
          window.addEventListener('touchend', onUp);
        }
        return (
          <div style={{ position: 'absolute', inset: 0, background: 'rgba(8,6,4,0.95)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', zIndex: 200, gap: 20 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
              <div style={{ width: 40, height: 2, background: '#c08820' }}/>
              <_PxLabel size={8} color="#c08820">YOUR DICE</_PxLabel>
              <div style={{ width: 40, height: 2, background: '#c08820' }}/>
            </div>
            <_PxLabel size={6} color="#3a2e20">DRAG TO ROTATE</_PxLabel>
            <div onMouseDown={handleDrag} onTouchStart={handleDrag} style={{ cursor: 'grab', userSelect: 'none', touchAction: 'none' }}>
              <_DiceCube3D faces={diceConfig} rolling={false} resultFace={0} size={140} customTransform={`rotateX(${inspectRotX}deg) rotateY(${inspectRotY}deg)`}/>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 6 }}>
              {localDice.map((v, i) => (
                <div key={i} style={{ background: '#110e08', border: '1px solid #2a1e16', padding: '6px 10px', textAlign: 'center' }}>
                  <_PxLabel size={5} color="#3a2e20">F{i + 1}</_PxLabel>
                  <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 28, color: '#ddd0b5', lineHeight: 1 }}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{ marginTop: 4 }}><_PxLabel size={6} color="#2a2018">SUM: {diceConfig.reduce((a,b)=>a+b,0)} / 21</_PxLabel></div>
            <button onClick={() => setShowDiceInspect(false)} style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 16, letterSpacing: 4, background: '#c08820', color: '#0a0806', border: 'none', padding: '12px 32px', cursor: 'pointer', boxShadow: '0 0 16px rgba(192,136,32,0.3)' }}>CLOSE</button>
          </div>
        );
      })()}

      {/* QUIT CONFIRM */}
      {showQuit && (
        <div style={{ position: 'absolute', inset: 0, background: 'rgba(8,6,4,0.92)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100 }}>
          <div style={{ background: '#0e0b08', border: '2px solid #2a1e16', padding: 24, maxWidth: 300, width: '90%' }}>
            <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 22, letterSpacing: 3, color: '#ddd0b5', marginBottom: 8 }}>EXIT DUNGEON?</div>
            <_PxLabel size={7} color="#3a2e20" style={{ lineHeight: 2.4, display: 'block', marginBottom: 16 }}>KEEP ¥{currentMoney.toLocaleString()}{'\n'}AND ALL CHEATS</_PxLabel>
            <div style={{ display: 'flex', gap: 8 }}>
              <button onClick={() => setShowQuit(false)} style={{ flex: 1, fontFamily: "'Bebas Neue', sans-serif", fontSize: 14, letterSpacing: 2, background: 'transparent', color: '#504540', border: '1px solid #2a1e16', padding: '10px', cursor: 'pointer' }}>CANCEL</button>
              <button onClick={quitDungeon} style={{ flex: 1, fontFamily: "'Bebas Neue', sans-serif", fontSize: 14, letterSpacing: 2, background: '#c42b24', color: '#e8d8b0', border: 'none', padding: '10px', cursor: 'pointer' }}>QUIT</button>
            </div>
          </div>
        </div>
      )}

      {/* PREP OVERLAY */}
      {showPrepOverlay && (() => {
        const diceSum = localDice.reduce((a,b)=>a+b,0);
        const remaining = 21 - diceSum;
        function updateFace(i, v) {
          const clamped = Math.max(0, parseInt(v)||0);
          const diff = clamped - localDice[i];
          if (diff > 0 && remaining - diff < 0) return;
          const nd = [...localDice]; nd[i] = clamped; setLocalDice(nd);
        }
        const barColor = diceSum >= 21 ? '#c42b24' : diceSum >= 16 ? '#c08820' : '#4e8a4e';
        return (
          <div style={{ position: 'absolute', inset: 0, background: 'rgba(8,6,4,0.96)', display: 'flex', flexDirection: 'column', zIndex: 100 }}>
            <div style={{ padding: '14px 20px', borderBottom: '1px solid #1e1610', flexShrink: 0, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 22, letterSpacing: 4, color: '#ddd0b5' }}>FIGHT PREP</div>
              <button onClick={() => setShowPrepOverlay(false)} style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 7, background: 'transparent', color: '#504540', border: '1px solid #2a1e16', padding: '5px 8px', cursor: 'pointer' }}>✕ CLOSE</button>
            </div>
            <div style={{ display: 'flex', flexShrink: 0, borderBottom: '1px solid #1e1610' }}>
              {['dice','cheats'].map(tab => (
                <button key={tab} onClick={() => setPrepTab(tab)} style={{ flex: 1, fontFamily: "'Bebas Neue', sans-serif", fontSize: 15, letterSpacing: 3, background: prepTab === tab ? '#130f08' : 'transparent', color: prepTab === tab ? '#ddd0b5' : '#504540', border: 'none', borderBottom: prepTab === tab ? '3px solid #c08820' : '3px solid transparent', padding: '10px', cursor: 'pointer' }}>
                  {tab === 'dice' ? `DICE  ${diceSum}/21` : `CHEATS  ${selectedCheats.length}/${maxCheats}`}
                </button>
              ))}
            </div>
            <div style={{ flex: 1, overflow: 'auto', padding: '16px 20px' }}>
              {prepTab === 'dice' && (
                <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start', justifyContent: 'center' }}>
                  <div style={{ position: 'relative', flexShrink: 0 }}>
                    <div style={{ position: 'absolute', left: 72 + 6, top: 0, width: 72, height: 72 * 4 + 6 * 3, background: 'rgba(196,43,36,0.04)', pointerEvents: 'none' }}/>
                    <div style={{ position: 'absolute', left: 0, top: 72 + 6, width: 72 * 3 + 6 * 2, height: 72, background: 'rgba(196,43,36,0.04)', pointerEvents: 'none' }}/>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 72px)', gridTemplateRows: 'repeat(4, 72px)', gap: 6 }}>
                      {Array.from({ length: 12 }).map((_, cellIdx) => {
                        const col = cellIdx % 3;
                        const row = Math.floor(cellIdx / 3);
                        const match = crossMap.find(([c, r]) => c === col && r === row);
                        if (!match) return <div key={cellIdx} style={{ width: 72, height: 72 }}/>;
                        const [, , faceIdx, isCenter] = match;
                        return <_DiceFaceCell key={cellIdx} value={localDice[faceIdx]} faceIdx={faceIdx} isCenter={isCenter} remaining={remaining} onChange={v => updateFace(faceIdx, v)}/>;
                      })}
                    </div>
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12, paddingTop: 8 }}>
                    <_DiceCube3D faces={localDice} resultFace={0} size={82}/>
                    <div style={{ background: '#0e0b08', border: '1px solid #1e1610', padding: '10px 12px', width: '100%' }}>
                      <div style={{ display: 'flex', alignItems: 'baseline', gap: 4, marginBottom: 5 }}>
                        <span style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 32, color: barColor, lineHeight: 1, textShadow: `0 0 10px ${barColor}66` }}>{diceSum}</span>
                        <span style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 13, color: '#3a3028' }}>/ 21</span>
                      </div>
                      <div style={{ height: 4, background: '#181410', marginBottom: 5 }}>
                        <div style={{ height: '100%', width: `${Math.min(100,(diceSum/21)*100)}%`, background: barColor, transition: 'all 0.2s', boxShadow: `0 0 5px ${barColor}88` }}/>
                      </div>
                      <_PxLabel size={5} color={remaining === 0 ? '#c42b24' : '#3a3028'}>{remaining > 0 ? `${remaining} PTS LEFT` : 'CAP REACHED'}</_PxLabel>
                    </div>
                    <div style={{ padding: '7px 9px', border: '1px solid #1e1610', width: '100%' }}>
                      <_PxLabel size={5} color="#2a2018" style={{ lineHeight: 2.2 }}>0 = SKIP TURN{'\n'}HIGH RISKY NEAR END</_PxLabel>
                    </div>
                  </div>
                </div>
              )}
              {prepTab === 'cheats' && (
                <div>
                  <_PxLabel size={6} color="#3a2e20" style={{ display: 'block', marginBottom: 10, lineHeight: 2 }}>SELECT UP TO {maxCheats} CHEATS · ▲ BUFF = OWN PATH · ▼ TRAP = ENEMY PATH</_PxLabel>
                  <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                    {inventory.map(id => {
                      const c = CHEATS_DATA[id]; if (!c) return null;
                      const sel = selectedCheats.includes(id);
                      const isGood = c.type === 'good';
                      const accent = isGood ? '#c08820' : '#c42b24';
                      const dimFrame = isGood ? '#4a3010' : '#4a1010';
                      return (
                        <div key={id} onClick={() => toggleCheat(id)} style={{ width: 'calc(50% - 4px)', padding: '10px 12px', cursor: 'pointer', background: sel ? (isGood ? '#1a1000' : '#160400') : '#110d08', border: `2px solid ${sel ? accent : dimFrame}`, borderLeft: `5px solid ${sel ? accent : dimFrame}`, transition: 'all 0.1s' }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 3 }}>
                            <_PxLabel size={7} color={sel ? accent : dimFrame}>{isGood ? '▲' : '▼'}</_PxLabel>
                            <div style={{ width: 6, height: 6, background: c.tier === 'high' ? '#c42b24' : c.tier === 'medium' ? '#c08820' : '#4e8a4e' }}/>
                          </div>
                          <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 14, color: sel ? accent : '#907868', lineHeight: 1, marginBottom: 3 }}>{c.name}</div>
                          <div style={{ fontFamily: "'Space Mono', monospace", fontSize: 8, color: '#3a3028', lineHeight: 1.4 }}>{c.desc}</div>
                        </div>
                      );
                    })}
                    {inventory.length === 0 && <_PxLabel size={7} color="#2a1e14">NO CHEATS OWNED YET</_PxLabel>}
                  </div>
                </div>
              )}
            </div>
            <div style={{ padding: '12px 20px', borderTop: '1px solid #1e1610', flexShrink: 0 }}>
              <button onClick={startFight} style={{ width: '100%', fontFamily: "'Bebas Neue', sans-serif", fontSize: 22, letterSpacing: 5, background: '#c42b24', color: '#e8d8b0', border: 'none', padding: '14px', cursor: 'pointer', boxShadow: '0 0 24px rgba(196,43,36,0.4)' }}>BEGIN FIGHT</button>
            </div>
          </div>
        );
      })()}
    </div>
  );
};

// ── BACK ROOM SCREEN ──────────────────────────────────────────────────────────
const BackRoomScreen = ({ money, level, inventory, onLeave, onReset }) => {
  const blind = calcBlind(money, level + 1);
  const PRICE_MULT = { low: 1, medium: 1.5, high: 2 };

  const [shopItems] = _useState(() => {
    const all = Object.values(CHEATS_DATA);
    const shuffled = [...all].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, 4).map(c => ({
      ...c,
      price: Math.max(1, Math.floor(blind * PRICE_MULT[c.tier])),
    }));
  });

  const [currentMoney, setCurrentMoney] = _useState(money);
  const [bought, setBought] = _useState([]);

  function buy(item) {
    if (bought.includes(item.id) || currentMoney < item.price) return;
    setBought(prev => [...prev, item.id]);
    setCurrentMoney(m => m - item.price);
  }

  function leave() { onLeave(currentMoney, [...inventory, ...bought]); }

  return (
    <div style={{ width: '100%', height: '100%', display: 'flex', flexDirection: 'column', background: '#080604', overflow: 'hidden', position: 'relative' }}>
      <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', background: 'radial-gradient(ellipse at 50% 95%, rgba(100,10,5,0.22) 0%, transparent 62%)' }}/>
      <div style={{ padding: '12px 16px', borderBottom: '1px solid #1e1610', flexShrink: 0, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
        <div>
          <h1 style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 28, letterSpacing: 5, color: '#ddd0b5', lineHeight: 1, margin: 0 }}>THE BACK ROOM</h1>
          <_PxLabel size={6} color="#3a2e20" style={{ display: 'block', marginTop: 3 }}>CLOCK STILL RUNNING · BROWSE FAST</_PxLabel>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 24, color: '#c08820', lineHeight: 1 }}>¥{currentMoney.toLocaleString()}</div>
          <_PxLabel size={5} color="#3a2e20">FUNDS</_PxLabel>
        </div>
      </div>
      <div style={{ padding: '6px 16px', borderBottom: '1px solid #1a1410', flexShrink: 0, display: 'flex', gap: 16, alignItems: 'center' }}>
        <_PxLabel size={6} color="#2a2018">FOR HIRE</_PxLabel>
        {[{ label: 'LOW', mult: 1 }, { label: 'MED', mult: 1.5 }, { label: 'HIGH', mult: 2 }].map(({ label, mult }) => (
          <_PxLabel key={label} size={5} color="#1e1810">{label}=¥{Math.max(1, Math.floor(blind * mult)).toLocaleString()}</_PxLabel>
        ))}
      </div>
      <div style={{ flex: 1, overflow: 'auto', padding: '12px 16px', display: 'flex', flexDirection: 'column', gap: 8 }}>
        {shopItems.map(item => {
          const alreadyOwned = inventory.includes(item.id);
          const justBought = bought.includes(item.id);
          const canAfford = !alreadyOwned && !justBought && currentMoney >= item.price;
          const isGood = item.type === 'good';
          const accent = isGood ? '#c08820' : '#c42b24';
          const dimFrame = isGood ? '#4a3010' : '#4a1010';
          const frameColor = justBought ? '#4a6c2a' : alreadyOwned ? '#2a2018' : dimFrame;
          const accentOrDim = justBought ? '#4a6c2a' : alreadyOwned ? '#3a3028' : accent;
          return (
            <div key={item.id} style={{ padding: '12px 14px', background: justBought ? '#0a1006' : '#0e0b08', border: `2px solid ${frameColor}`, borderLeft: `5px solid ${accentOrDim}`, opacity: alreadyOwned ? 0.5 : 1, display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, transition: 'all 0.12s' }}>
              <div style={{ flex: 1 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 3 }}>
                  <span style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 18, letterSpacing: 1, color: accentOrDim, lineHeight: 1 }}>{item.name}</span>
                  <div style={{ width: 6, height: 6, background: item.tier === 'high' ? '#c42b24' : item.tier === 'medium' ? '#c08820' : '#4e8a4e' }}/>
                  <_PxLabel size={5} color={isGood ? '#4a3010' : '#4a1010'}>{isGood ? '▲ BUFF' : '▼ TRAP'}</_PxLabel>
                </div>
                <div style={{ fontFamily: "'Space Mono', monospace", fontSize: 8, color: '#3a3028', lineHeight: 1.5 }}>{item.desc}</div>
              </div>
              <div style={{ flexShrink: 0 }}>
                {justBought ? (
                  <_PxLabel size={7} color="#4a6c2a">HIRED</_PxLabel>
                ) : alreadyOwned ? (
                  <_PxLabel size={6} color="#2a2018">OWNED</_PxLabel>
                ) : (
                  <button onClick={() => buy(item)} disabled={!canAfford} style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 14, letterSpacing: 2, padding: '8px 14px', background: canAfford ? accent : '#1a1410', color: canAfford ? (isGood ? '#0a0806' : '#e8d8b0') : '#2a2018', border: `1px solid ${canAfford ? accent : '#2a1e16'}`, cursor: canAfford ? 'pointer' : 'not-allowed', boxShadow: canAfford ? `0 0 10px ${accent}44` : 'none', transition: 'all 0.12s' }}>
                    TAKE ON  ¥{item.price.toLocaleString()}
                  </button>
                )}
              </div>
            </div>
          );
        })}
      </div>
      <div style={{ padding: '12px 16px', borderTop: '1px solid #1e1610', flexShrink: 0, display: 'flex', gap: 8 }}>
        {onReset && (
          <button onClick={onReset} style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 13, letterSpacing: 2, background: 'transparent', color: '#4a2018', border: '1px solid #1e1410', padding: '10px 14px', cursor: 'pointer' }}>RESET</button>
        )}
        <button onClick={leave} style={{ flex: 1, fontFamily: "'Bebas Neue', sans-serif", fontSize: 20, letterSpacing: 5, background: 'transparent', color: '#907868', border: '2px solid #3a2e20', padding: '13px', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center', transition: 'all 0.12s' }}>
          <span>BACK OUT</span><span style={{ fontSize: 14, opacity: 0.6 }}>→ FIGHT</span>
        </button>
      </div>
    </div>
  );
};

Object.assign(window, { TitleScreen, DiceScreen, BattleScreen, BackRoomScreen, CHEATS_DATA });
</script>

<!-- ── APP ───────────────────────────────────────────────────────────────────── -->
<script type="text/babel">
const { useState, useRef } = React;

const SAVE_KEY = 'bakuto_state_v1';

const DEFAULT_STATE = {
  money: 10000,
  level: 0,
  inventory: [],
  diceConfig: [4, 4, 4, 3, 3, 3],
};

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (raw && typeof raw.money === 'number') return { ...DEFAULT_STATE, ...raw };
  } catch (e) {}
  return { ...DEFAULT_STATE };
}

function App() {
  const [screen, setScreen] = useState('title');
  const [state, setState] = useState(loadState);

  function save(patch) {
    setState(prev => {
      const next = { ...prev, ...patch };
      localStorage.setItem(SAVE_KEY, JSON.stringify(next));
      return next;
    });
  }

  function reset() {
    localStorage.removeItem(SAVE_KEY);
    setState({ ...DEFAULT_STATE });
    setScreen('title');
  }

  function enterDungeon() {
    const nextLevel = state.level + 1;
    if (nextLevel % 7 === 0) setScreen('backroom');
    else setScreen('battle');
  }

  function handleBattleExit(result, finalMoney) {
    const nextLevel = result === 'win' ? state.level + 1 : state.level;
    save({ money: finalMoney !== undefined ? finalMoney : state.money, level: nextLevel });
    setScreen('title');
  }

  function handleDeath() { reset(); }

  function handleBackRoomLeave(money, inventory) {
    save({ money, inventory });
    setScreen('battle');
  }

  const { TitleScreen, DiceScreen, BattleScreen, BackRoomScreen } = window;

  if (screen === 'title') return (
    <TitleScreen money={state.money} level={state.level} inventory={state.inventory}
      onEnterDungeon={enterDungeon} onDice={() => setScreen('dice')} onReset={reset}/>
  );
  if (screen === 'dice') return (
    <DiceScreen diceConfig={state.diceConfig}
      onSave={faces => { save({ diceConfig: faces }); setScreen('title'); }}
      onBack={() => setScreen('title')}/>
  );
  if (screen === 'backroom') return (
    <BackRoomScreen money={state.money} level={state.level} inventory={state.inventory}
      onLeave={handleBackRoomLeave} onReset={reset}/>
  );
  if (screen === 'battle') return (
    <BattleScreen money={state.money} setMoney={() => {}} level={state.level + 1}
      diceConfig={state.diceConfig} inventory={state.inventory}
      onExit={handleBattleExit} onDeath={handleDeath} onReset={reset}/>
  );
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
